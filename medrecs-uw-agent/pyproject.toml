[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrecs-uw-agent"
version = "0.1.0"
description = "Agentic medical-records workbench for life insurance underwriting (Precord Real-data E2E)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mallesh B" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25,<1.45",
  "opentelemetry-sdk>=1.25,<1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
medrecs-uw = "medrecs_uw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medrecs_uw = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
